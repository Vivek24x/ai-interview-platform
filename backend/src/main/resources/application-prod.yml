spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/prep_ai_db}
      database: ${MONGODB_DATABASE:prep_ai_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.prep.ai: INFO
    org.springframework.security: WARN

management:
  health:
    redis:
      enabled: false
