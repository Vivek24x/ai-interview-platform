server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ai-interview-platform-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/prep_ai_db}
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Security and JWT configurations
app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3e71b5a0f6c2e8d1a4b7c9e3f5a8b2d1c4e7f0a3b6d9e2c5f8a1b4d7e8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3}
    expiration-ms: 86400000 # 24 Hours (Access Token)
    refresh-expiration-ms: 604800000 # 7 Days (Refresh Token)
  services:
    ai-service:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
      secret: ${AI_SERVICE_SECRET:prep_ai_internal_token_987}
    judge0:
      base-url: ${JUDGE0_BASE_URL:https://judge0-ce.p.rapidapi.com}
      api-key: ${JUDGE0_API_KEY:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
